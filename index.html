<script>/* Vigia de carregamento do Courier Bike.
   Fica DENTRO do index.html (não depende de nenhum outro arquivo do site) e só aparece se o app não iniciar:
   mostra na tela, em português, o motivo (erro do navegador), em vez de deixar a página em branco.
   O app avisa que iniciou com window.__courierReady = true (src/ui/main.tsx). */
(function () {
  var WAIT_MS = 8000;
  var shown = false;
  var lastError = '';

  function ready() {
    return window.__courierReady === true;
  }

  function el(tag, css, text) {
    var e = document.createElement(tag);
    if (css) e.style.cssText = css;
    if (text) e.textContent = text;
    return e;
  }

  function render() {
    var old = document.getElementById('courier-boot-fail');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var box = el('div', 'position:fixed;inset:0;z-index:2147483647;overflow:auto;background:#050506;color:#f2f2f4;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:max(20px,env(safe-area-inset-top)) 20px 28px');
    box.id = 'courier-boot-fail';
    box.setAttribute('role', 'alert');
    box.setAttribute('data-testid', 'boot-fail');
    var wrap = el('div', 'max-width:520px;margin:0 auto');
    wrap.appendChild(el('div', 'font-weight:800;letter-spacing:.14em;font-size:13px;color:#9a9aa3;margin:8px 0 18px', 'COURIER BIKE'));
    wrap.appendChild(el('h1', 'font-size:22px;line-height:1.2;margin:0 0 10px', 'O app não iniciou'));
    wrap.appendChild(el('p', 'margin:0 0 16px;color:#c9c9d0', 'A página chegou, mas o app não conseguiu começar neste navegador. Seus dados não foram tocados.'));
    if (lastError) wrap.appendChild(el('p', 'margin:0 0 16px;padding:10px 12px;border-radius:10px;background:#141418;border:1px solid #5a2a2a;font:13px ui-monospace,Menlo,monospace;color:#ff8d8d;word-break:break-all', 'Erro: ' + lastError));
    wrap.appendChild(el('p', 'margin:0 0 12px;color:#e6e6ea', 'Toque em TENTAR DE NOVO. Se continuar, atualize o navegador (Chrome) e mande um print desta tela.'));
    wrap.appendChild(el('p', 'margin:0 0 18px;font:12px ui-monospace,Menlo,monospace;color:#8a8a93;word-break:break-all', 'Endereço: ' + location.host));
    var btn = el('button', 'font:inherit;font-weight:800;letter-spacing:.06em;color:#050506;background:#f2f2f4;border:0;border-radius:12px;padding:14px 20px;width:100%;min-height:48px', 'TENTAR DE NOVO');
    btn.type = 'button';
    btn.addEventListener('click', function () {
      location.reload();
    });
    wrap.appendChild(btn);
    box.appendChild(wrap);
    document.body.appendChild(box);
  }

  function show() {
    if (ready() || shown) return;
    shown = true;
    render();
  }

  // 1) erro de execução antes de o app iniciar → avisa logo, com o texto do erro
  window.addEventListener('error', function (e) {
    if (ready() || !e.message) return;
    lastError = String(e.message).slice(0, 200);
    setTimeout(show, 1500);
  });
  // 2) rede lenta ou travada: depois de um tempo sem o app iniciar, avisa também
  setTimeout(show, WAIT_MS);
  // 3) se o app iniciar depois do aviso, o aviso some sozinho
  var poll = setInterval(function () {
    if (!ready()) return;
    clearInterval(poll);
    var box = document.getElementById('courier-boot-fail');
    if (box && box.parentNode) box.parentNode.removeChild(box);
  }, 400);
})();</script>

/* Layout: coluna única de celular. Jornada = painel de estado no topo, linha do tempo rolável no meio
   (passado em cima, presente embaixo) e dock de ações ao alcance do polegar. */
:root {
  --bg: #050506;
  --s1: #0c0c0e;
  --s2: #131316;
  --s3: #1b1b1f;
  --s4: #26262b;
  --line: #222227;
  --line2: #323239;
  --fg: #f5f5f6;
  --fg2: #bdbdc4;
  --fg3: #8e8e98;
  --red: #ea1d2c;
  --red-hi: #ff4250;
  --red-lo: #a1111d;
  --red-a08: rgba(234, 29, 44, 0.08);
  --red-a14: rgba(234, 29, 44, 0.14);
  --red-a28: rgba(234, 29, 44, 0.28);
  --red-glow: rgba(234, 29, 44, 0.5);
  --green: #35d489;
  --green-a: rgba(53, 212, 137, 0.12);
  --amber: #ffb224;
  --amber-a: rgba(255, 178, 36, 0.12);
  --blue: #7ea6ff;
  --blue-a: rgba(126, 166, 255, 0.12);
  --font-display: 'Sora', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  overflow-x: hidden;
}
#root { height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--red-hi); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.gut {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ───────── Estrutura ───────── */
.app {
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(120% 40% at 50% -10%, rgba(234, 29, 44, 0.1), transparent 60%),
    var(--bg);
}
@media (min-width: 560px) {
  .app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
}
.topbar {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
  border-bottom: 1px solid var(--line);
  background: rgba(5, 5, 6, 0.85);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; letter-spacing: 0.16em; font-size: 14px; }
.brand b { color: var(--red-hi); font-weight: 800; }
.brand .led { margin-right: 2px; }
.top-right { display: flex; align-items: center; gap: 4px; }
.top-clock { font-family: var(--font-mono); font-size: 13px; color: var(--fg2); margin-right: 4px; }
.icon-btn {
  width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px;
  border: 0; background: transparent; color: var(--fg2);
  transition: background 0.15s, transform 0.12s var(--ease), color 0.15s;
}
.icon-btn:hover { background: var(--s2); color: var(--fg); }
.icon-btn:active { transform: scale(0.92); }

.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; animation: screen-in 0.26s var(--ease); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-top: 14px; padding-bottom: 28px; display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }

.nav {
  flex: none; position: relative; display: grid; grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--line); background: rgba(8, 8, 10, 0.96);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.nav button {
  position: relative; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  background: none; border: 0; color: var(--fg3); font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
  transition: color 0.2s, transform 0.12s var(--ease);
}
.nav button:active { transform: scale(0.94); }
.nav button[aria-selected='true'] { color: var(--fg); }
.nav button[aria-selected='true'] svg { color: var(--red-hi); filter: drop-shadow(0 0 8px var(--red-glow)); }
.nav-ind {
  position: absolute; top: -1px; left: 0; height: 2px; width: calc((100% - 16px) / 4); margin-left: 8px;
  background: var(--red); box-shadow: 0 0 14px 1px var(--red-glow); border-radius: 0 0 3px 3px;
  transition: transform 0.35s var(--ease);
}

.demo-bar {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px;
  background: var(--amber-a); border-bottom: 1px solid rgba(255, 178, 36, 0.25); color: var(--amber); font-size: 12.5px; font-weight: 600;
}
.demo-bar button { background: none; border: 0; color: var(--fg); font-weight: 700; font-size: 12.5px; text-decoration: underline; padding: 8px 0 8px 8px; }

/* ───────── Superfícies ───────── */
.card {
  background: linear-gradient(180deg, var(--s2), var(--s1));
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 14px 30px -20px #000;
}
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.h2 { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.01em; margin: 0; }
.label { font-size: 11.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--fg3); font-weight: 600; }
.muted { color: var(--fg3); }
.sub { color: var(--fg2); font-size: 13px; }
.red { color: var(--red-hi); }
.green { color: var(--green); }
.amber { color: var(--amber); }
.blue { color: var(--blue); }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.hr { height: 1px; background: var(--line); margin: 12px 0; border: 0; }

.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; font-size: 14.5px; }
.kv span:first-child { color: var(--fg2); }
.kv strong { font-weight: 600; font-variant-numeric: tabular-nums; }
.kv.total { font-size: 16px; padding-top: 10px; }
.kv.total strong { font-family: var(--font-display); font-size: 20px; }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stats.s3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stats.s4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stat { background: var(--s1); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 19px; margin-top: 4px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .s { font-size: 12px; color: var(--fg3); margin-top: 2px; }

/* ───────── Botões ───────── */
.btn {
  min-height: 52px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line2); background: var(--s3); color: var(--fg);
  font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform 0.12s var(--ease), background 0.15s, border-color 0.15s, box-shadow 0.2s; user-select: none; -webkit-user-select: none;
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:hover:not(:disabled) { background: var(--s4); }
.btn:disabled { opacity: 0.4; }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: 13.5px; border-radius: 12px; }
.btn.primary { background: linear-gradient(180deg, #f32a39, var(--red) 55%, var(--red-lo)); border-color: #ff6a75; box-shadow: 0 8px 26px -8px var(--red-glow), 0 1px 0 rgba(255, 255, 255, 0.25) inset; color: #fff; }
.btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #ff3a49, #f0212f 55%, #b3121f); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: rgba(234, 29, 44, 0.5); color: var(--red-hi); background: var(--red-a08); }
.btn.green { background: var(--green-a); border-color: rgba(53, 212, 137, 0.5); color: var(--green); }

.big {
  position: relative; width: 100%; min-height: 64px; border-radius: 18px; border: 1px solid #ff6a75; color: #fff; padding: 0 12px;
  font-family: var(--font-display); font-weight: 800; font-size: clamp(15px, 4.6vw, 18px); letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.15; text-align: center;
  background: linear-gradient(180deg, #f93241, var(--red) 55%, var(--red-lo));
  box-shadow: 0 12px 34px -10px var(--red-glow), 0 1px 0 rgba(255, 255, 255, 0.3) inset;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  transition: transform 0.14s var(--ease), box-shadow 0.3s, filter 0.2s; user-select: none; -webkit-user-select: none;
}
.big:active:not(:disabled) { transform: scale(0.975); filter: brightness(1.08); }
.big:disabled { opacity: 0.55; }
.big.idle-glow { animation: glow-breathe 3.2s ease-in-out infinite; }
.big.live { animation: glow-pulse 1.6s ease-in-out infinite; }
.big.quiet { background: linear-gradient(180deg, var(--s4), var(--s3)); border-color: var(--line2); box-shadow: none; color: var(--fg); }
.big small { display: block; font-family: var(--font-mono); font-size: 13px; font-weight: 500; letter-spacing: 0.04em; opacity: 0.9; text-transform: none; }

/* Pressionar e segurar */
.hold { position: relative; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.hold-fill { position: absolute; inset: 0; background: rgba(255, 66, 80, 0.4); transform: scaleX(0); transform-origin: left; pointer-events: none; }
.hold.holding .hold-fill { animation: hold-fill var(--hold-ms, 800ms) linear forwards; }
.hold-content { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; pointer-events: none; }
.hold.shake { animation: shake 0.35s; }
.hold.holding { border-color: var(--red-hi); }

.dock { flex: none; padding-top: 10px; padding-bottom: 10px; border-top: 1px solid var(--line); background: linear-gradient(180deg, rgba(8, 8, 10, 0.92), #070708); display: flex; flex-direction: column; gap: 8px; }
.dock-main { display: flex; gap: 8px; min-width: 0; }
.dock-main .big { flex: 1; min-width: 0; }
.big-label { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
.dock-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.dock-row.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.dock-row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.dk {
  min-height: 56px; min-width: 0; padding: 6px 2px; border-radius: 14px; border: 1px solid var(--line2); background: var(--s2); color: var(--fg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: clamp(10.5px, 3vw, 12px); font-weight: 600; letter-spacing: 0; line-height: 1.15; text-align: center;
  transition: transform 0.12s var(--ease), background 0.15s, border-color 0.15s;
}
.dk:active:not(:disabled) { transform: scale(0.95); }
.dk:hover:not(:disabled) { background: var(--s3); }
.dk:disabled { opacity: 0.35; }
.dk.hold.danger { border-color: rgba(234, 29, 44, 0.45); color: var(--red-hi); }
.dk.danger-ink { border-color: rgba(234, 29, 44, 0.4); color: var(--red-hi); }
.dk.sq { flex: none; width: clamp(66px, 20vw, 76px); min-height: 64px; border-radius: 18px; padding: 4px; }
.dk > span, .dk .hold-content > span { min-width: 0; overflow-wrap: normal; word-break: normal; hyphens: none; }

/* ───────── Painel da Jornada ───────── */
.hero-sticky { position: sticky; top: 0; z-index: 5; padding-top: 10px; padding-bottom: 8px; margin-bottom: -2px; background: linear-gradient(var(--bg) 88%, transparent); }
.hero { padding: 12px 14px; border-radius: 20px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--s2), var(--s1)); position: relative; overflow: hidden; transition: border-color 0.3s, box-shadow 0.4s; min-width: 0; }
.hero[data-s='working'] { border-color: rgba(234, 29, 44, 0.35); box-shadow: 0 0 40px -22px var(--red-glow); }
.hero[data-s='running'] { border-color: rgba(255, 66, 80, 0.7); animation: glow-pulse 1.6s ease-in-out infinite; }
.hero[data-s='paused'] { border-color: rgba(126, 166, 255, 0.45); box-shadow: 0 0 36px -24px rgba(126, 166, 255, 0.8); }
.hero[data-s='paused-over'] { border-color: rgba(255, 178, 36, 0.8); animation: glow-pulse-amber 1.4s ease-in-out infinite; }
.hero[data-s='interrupted'] { border-color: rgba(255, 178, 36, 0.5); box-shadow: 0 0 36px -24px rgba(255, 178, 36, 0.7); }
.hero[data-s='finished'] { border-color: rgba(53, 212, 137, 0.4); }
.hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; min-height: 28px; }
.hero-hist { width: 36px; height: 36px; margin: -6px -8px -6px 0; flex: none; }
.state-label { display: flex; align-items: center; gap: 9px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: var(--fg2); min-width: 0; flex: 1; line-height: 1.25; padding-top: 2px; }
.state-label > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.clock { font-family: var(--font-mono); font-weight: 700; font-size: clamp(34px, 12.5vw, 46px); letter-spacing: -0.03em; line-height: 1.05; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock-cap { font-size: 12.5px; color: var(--fg3); margin: 1px 0 2px; font-weight: 500; }
.hero[data-s='running'] .clock { color: #fff; text-shadow: 0 0 22px var(--red-glow); }
.hero[data-s='paused'] .clock { color: var(--blue); }
.hero[data-s='paused-over'] .clock, .clock.over { color: var(--amber); text-shadow: 0 0 22px rgba(255, 178, 36, 0.5); }
.hero[data-s='paused-over'] .clock-cap { color: var(--amber); font-weight: 600; }
.hero[data-s='interrupted'] .clock { color: var(--amber); }
.hero[data-s='finished'] .clock { color: var(--green); }
.hero[data-s='idle'] .clock { color: var(--fg3); }
.clock-sub { font-size: 13px; color: var(--fg2); margin-top: 2px; display: flex; gap: 4px 14px; flex-wrap: wrap; }

/* Células de leitura: rótulo pequeno em cima, valor embaixo. Quebram em 2/3/4 colunas conforme a largura, sem cortar texto. */
.cells { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(var(--cell-min, 90px), 100%), 1fr)); gap: 6px; margin: 0; }
.cell { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px; min-width: 0; }
.cell dt { font-size: 11.5px; color: var(--fg3); font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.cell dd { margin: 2px 0 0; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; line-height: 1.2; overflow-wrap: anywhere; }
.cell dd.mono, .cell dd .mono { font-size: 14px; }
.cell.good dd { color: var(--green); }
.hero-more > .cells { margin-top: 0; }
.pause-cells { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 480px) { .pause-cells { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.pause-bar { height: 6px; border-radius: 99px; background: var(--s4); overflow: hidden; margin-top: 8px; }
.pause-bar > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #4a73d1, var(--blue)); transition: width 0.6s linear; }
.pause-bar.over > i { background: linear-gradient(90deg, #c47f00, var(--amber)); }

.hero-more { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.hero-more > .cells + .cells { margin-top: -4px; }
.goal-card, .ind-card { padding: 12px 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--s1); display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.goal-card.reached { border-color: rgba(53, 212, 137, 0.45); background: linear-gradient(180deg, rgba(53, 212, 137, 0.08), var(--s1)); }
.goal-head { display: flex; align-items: center; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap; }
.goal-card .proj, .goal-card .proj-hint { margin-top: 0; }
.week-hint { padding: 0 4px 2px; }

.bar { height: 8px; border-radius: 99px; background: var(--s4); overflow: hidden; position: relative; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--red-lo), var(--red-hi)); box-shadow: 0 0 12px var(--red-glow); transition: width 0.6s var(--ease); }
.bar.done > i { background: linear-gradient(90deg, #1f9d63, var(--green)); box-shadow: 0 0 12px rgba(53, 212, 137, 0.5); }
.bar.thin { height: 5px; }

.banner { margin-top: 2px; padding: 12px 14px; border-radius: 16px; border: 1px solid rgba(255, 178, 36, 0.4); background: var(--amber-a); display: flex; flex-direction: column; gap: 10px; animation: screen-in 0.3s var(--ease); }
.banner p { margin: 0; font-size: 14px; }
.banner .row { gap: 8px; }

/* ───────── Linha do tempo ───────── */
.j-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 0; scroll-padding-top: 130px; }
.j-scroll > * { flex: none; }
.tl { padding-top: 16px; padding-bottom: 24px; display: flex; flex-direction: column; border-top: 1px dashed var(--line); margin-top: 12px; min-width: 0; }
.tl-item { display: grid; grid-template-columns: clamp(38px, 11.5vw, 46px) 30px minmax(0, 1fr); column-gap: clamp(6px, 2vw, 10px); position: relative; --tone: var(--fg2); }
.tl-item.k-start, .tl-item.k-end { --tone: #fff; }
.tl-item.k-run { --tone: var(--red-hi); }
.tl-item.k-break { --tone: var(--blue); }
.tl-item.k-money { --tone: var(--green); }
.tl-item.k-occ { --tone: var(--amber); }
.tl-item.k-int { --tone: var(--amber); }
.tl-time { padding-top: 16px; text-align: right; font-family: var(--font-mono); font-size: 12.5px; color: var(--fg2); line-height: 1.15; }
.tl-time small { display: block; font-size: 10.5px; color: var(--fg3); }
.tl-rail { position: relative; display: flex; justify-content: center; }
.tl-rail::before { content: ''; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--line2); }
.tl-item:first-child .tl-rail::before { top: 26px; }
.tl-item.last .tl-rail::before { bottom: auto; height: 26px; }
.tl-node {
  position: relative; z-index: 1; margin-top: 11px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: var(--bg); border: 1.5px solid var(--tone); color: var(--tone);
}
.tl-item.k-run.fill .tl-node { background: var(--red); border-color: var(--red-hi); color: #fff; }
.tl-item.k-money .tl-node { background: var(--green-a); }
.tl-item.k-occ .tl-node { background: var(--amber-a); }
.tl-item.k-int .tl-node { background: var(--amber-a); }
.tl-item.k-int.fill .tl-node { background: var(--amber); border-color: var(--amber); color: #1a1100; }
.tl-item.k-break .tl-node { background: var(--blue-a); }
.tl-body {
  margin: 5px 0 9px; padding: 10px 12px; border-radius: 14px; background: var(--s1); border: 1px solid var(--line); text-align: left; width: 100%; color: inherit; overflow-wrap: anywhere;
  display: block; min-width: 0; transition: border-color 0.3s, box-shadow 0.4s, background 0.15s;
}
button.tl-body:active { background: var(--s2); }
.tl-title { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 2px 10px; font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.tl-amount { font-family: var(--font-display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
.tl-title > span:first-child { min-width: 0; }
.tl-meta { color: var(--fg2); font-size: 13px; margin-top: 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; line-height: 1.35; }
.tl-note { color: var(--fg2); font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
.tl-item.latest .tl-body { border-color: color-mix(in srgb, var(--tone) 55%, transparent); box-shadow: 0 0 26px -10px var(--tone); }
.tl-item.latest .tl-node { box-shadow: 0 0 14px -2px var(--tone); }
.tl-item.is-new { animation: tl-in 0.5s var(--ease); }
.tl-item.is-new .tl-body { animation: flash 1.4s ease-out; }
.tl-item.now .tl-node { width: 14px; height: 14px; margin: 19px 8px 0; border: 0; background: var(--red-hi); box-shadow: 0 0 14px var(--red-glow); animation: pulse-dot 1.4s ease-in-out infinite; }
.tl-item.now .tl-body { background: none; border: 0; padding: 12px 0; margin: 5px 0; color: var(--fg3); font-size: 13px; }
.tl-item.now .tl-rail::before { height: 26px; bottom: auto; }
.chip-s { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600; background: var(--s3); color: var(--fg2); border: 1px solid var(--line2); }
.chip-s.amber { background: var(--amber-a); color: var(--amber); border-color: rgba(255, 178, 36, 0.35); }
.chip-s.green { background: var(--green-a); color: var(--green); border-color: rgba(53, 212, 137, 0.35); }
.chip-s.red { background: var(--red-a14); color: var(--red-hi); border-color: rgba(234, 29, 44, 0.4); }
.empty { text-align: center; padding: 36px 20px; color: var(--fg2); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .ico { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; background: var(--s2); border: 1px solid var(--line2); color: var(--fg3); }
.empty h3 { margin: 0; font-family: var(--font-display); font-size: 17px; color: var(--fg); }
.empty p { margin: 0; max-width: 30ch; font-size: 14px; }
.j-scroll .empty { padding: 20px 20px 12px; gap: 8px; }
.j-scroll .empty .ico { width: 44px; height: 44px; border-radius: 14px; }

/* ───────── LED / pílulas ───────── */
.led { width: 10px; height: 10px; border-radius: 50%; background: var(--fg3); flex: none; display: inline-block; }
.led.red { background: var(--red-hi); box-shadow: 0 0 10px 2px var(--red-glow); }
.led.pulse { animation: pulse-dot 1.4s ease-in-out infinite; }
.led.fast { animation: pulse-dot 0.8s ease-in-out infinite; }
.led.amber { background: var(--amber); box-shadow: 0 0 10px 1px rgba(255, 178, 36, 0.5); }
.led.blue { background: var(--blue); box-shadow: 0 0 10px 1px rgba(126, 166, 255, 0.5); }
.led.green { background: var(--green); box-shadow: 0 0 10px 1px rgba(53, 212, 137, 0.5); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px; font-size: 12.5px; font-weight: 700; border: 1px solid var(--line2); background: var(--s3); color: var(--fg2); white-space: nowrap; }
.pill.red { background: var(--red-a14); color: var(--red-hi); border-color: rgba(234, 29, 44, 0.45); }
.pill.solid-red { background: var(--red); color: #fff; border-color: #ff6a75; }
.pill.green { background: var(--green-a); color: var(--green); border-color: rgba(53, 212, 137, 0.4); }
.pill.amber { background: var(--amber-a); color: var(--amber); border-color: rgba(255, 178, 36, 0.4); }
.pill.blue { background: var(--blue-a); color: var(--blue); border-color: rgba(126, 166, 255, 0.4); }

/* ───────── Sheets ───────── */
.backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.66); backdrop-filter: blur(3px); animation: fade-in 0.2s ease-out; }
.sheet {
  position: fixed; z-index: 51; left: 0; right: 0; bottom: 0; margin: 0 auto; width: min(100%, 520px); max-height: 92%; display: flex; flex-direction: column;
  background: linear-gradient(180deg, #17171a, #0e0e10); border: 1px solid var(--line2); border-bottom: 0; border-radius: 24px 24px 0 0;
  box-shadow: 0 -20px 60px -20px rgba(0, 0, 0, 0.9), 0 -1px 0 rgba(255, 255, 255, 0.06) inset; animation: sheet-in 0.32s var(--ease);
}
.sheet-grip { width: 38px; height: 4px; border-radius: 4px; background: var(--line2); margin: 8px auto 0; flex: none; }
.sheet-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; padding-bottom: 6px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
.sheet-head h2 { margin: 0; font-family: var(--font-display); font-size: 18px; font-weight: 700; }
.sheet-body { overflow-y: auto; padding-top: 8px; padding-bottom: 8px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }
.sheet-foot { flex: none; padding-top: 10px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); }
.sheet-foot .row { gap: 10px; }
.sheet-foot .row > * { flex: 1; }

/* ───────── Formulários ───────── */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg3); font-weight: 600; }
.input {
  width: 100%; min-height: 56px; padding: 0 14px; border-radius: 14px; background: var(--s2); border: 1.5px solid var(--line2); color: var(--fg); font-size: 19px; font-weight: 600;
  transition: border-color 0.15s, box-shadow 0.2s; min-width: 0; font-variant-numeric: tabular-nums;
}
.input.text { font-size: 16px; font-weight: 500; }
.input::placeholder { color: var(--fg3); font-weight: 500; }
.input:focus { outline: none; border-color: var(--red-hi); box-shadow: 0 0 0 4px var(--red-a14); }
.input.bad { border-color: var(--amber); }
.input-wrap { position: relative; }
.input-wrap .pre { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--fg3); font-weight: 600; font-size: 16px; pointer-events: none; }
.input-wrap .input { padding-left: 46px; }
.input-wrap .pre.post { left: auto; right: 14px; }
.input-wrap:has(.pre.post) .input { padding-left: 14px; padding-right: 52px; }
.err { color: var(--amber); font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.hint { color: var(--fg3); font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 46px; padding: 0 16px; border-radius: 14px; border: 1.5px solid var(--line2); background: var(--s2); color: var(--fg2); font-weight: 600; font-size: 14.5px;
  display: inline-flex; align-items: center; gap: 8px; transition: all 0.15s var(--ease);
}
.chip:active { transform: scale(0.96); }
.chip[aria-pressed='true'] { border-color: var(--red-hi); background: var(--red-a14); color: #fff; box-shadow: 0 0 18px -6px var(--red-glow); }
.chip.grid { flex: 1 1 calc(50% - 8px); justify-content: flex-start; }
.stepper { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; }
.stepper .btn { min-height: 56px; padding: 0; font-size: 22px; }
.stepper .input { text-align: center; }
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

/* ───────── Escala ───────── */
.week-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.week-nav .mid { text-align: center; flex: 1; min-width: 0; }
.week-nav .mid b { font-family: var(--font-display); font-size: 16px; display: block; }
.day-card { background: linear-gradient(180deg, var(--s2), var(--s1)); border: 1px solid var(--line); border-radius: 18px; padding: 12px; }
.day-card.today { border-color: rgba(234, 29, 44, 0.45); box-shadow: 0 0 34px -22px var(--red-glow); }
.day-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.day-name { font-family: var(--font-display); font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.day-name small { font-family: var(--font-mono); font-weight: 500; color: var(--fg3); font-size: 12.5px; }
.blocks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.bc {
  position: relative; min-height: 76px; border-radius: 13px; border: 1.5px solid var(--line2); background: var(--s2); color: var(--fg2); padding: 8px 7px 9px; text-align: left;
  display: flex; flex-direction: column; gap: 1px; overflow: hidden; transition: transform 0.12s var(--ease), background 0.2s, border-color 0.2s;
}
.bc:active { transform: scale(0.95); }
.bc .b-top { display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 12.5px; letter-spacing: 0.04em; }
.bc .b-time { font-family: var(--font-mono); font-size: 10.5px; color: inherit; opacity: 0.8; }
.bc .b-work { font-family: var(--font-mono); font-size: 10px; margin-top: auto; line-height: 1.2; }
.bc .b-state { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-top: auto; }
.bc .b-fill { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--amber); border-radius: 0 3px 0 0; }
.bc[data-s='planned'] { border-color: var(--red); background: var(--red-a08); color: var(--fg); }
.bc[data-s='in_progress'] { border-color: var(--red-hi); background: linear-gradient(180deg, rgba(234, 29, 44, 0.4), rgba(234, 29, 44, 0.16)); color: #fff; animation: glow-pulse 1.6s ease-in-out infinite; }
.bc[data-s='interrupted'] { border-color: var(--amber); background: linear-gradient(180deg, rgba(255, 178, 36, 0.28), rgba(255, 178, 36, 0.1)); color: var(--fg); }
.bc[data-s='absent'] { border-color: rgba(234, 29, 44, 0.55); background: repeating-linear-gradient(135deg, var(--red-a08) 0 6px, rgba(234, 29, 44, 0.16) 6px 12px); color: var(--fg2); }
.bc[data-s='done'] { border-color: var(--green); background: var(--green-a); color: var(--fg); }
.bc[data-s='partial'] { border-color: var(--amber); background: var(--amber-a); color: var(--fg); }
.bc[data-s='missed'] { border-color: var(--line2); background: repeating-linear-gradient(135deg, var(--s2) 0 6px, var(--s3) 6px 12px); color: var(--fg3); }
.bc[data-s='off'] { border-color: rgba(126, 166, 255, 0.4); background: var(--blue-a); color: var(--blue); }
.bc[data-s='unplanned'] { border-style: dashed; color: var(--fg3); }
.bc[data-s='extra'] { border-style: dashed; border-color: var(--green); color: var(--fg2); }
.bc[data-s='done'] .b-state, .bc[data-s='done'] .b-top svg { color: var(--green); }
.bc[data-s='partial'] .b-state, .bc[data-s='partial'] .b-top svg { color: var(--amber); }
.bc[data-s='planned'] .b-state, .bc[data-s='planned'] .b-top svg { color: var(--red-hi); }
.bc[data-s='interrupted'] .b-state, .bc[data-s='interrupted'] .b-top svg { color: var(--amber); }
.bc[data-s='absent'] .b-state, .bc[data-s='absent'] .b-top svg { color: var(--red-hi); }
.day-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 12.5px; color: var(--fg2); flex-wrap: wrap; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; color: var(--fg2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 5px; border: 1.5px solid var(--line2); display: inline-block; }
.legend i[data-s='planned'] { border-color: var(--red); background: var(--red-a14); }
.legend i[data-s='in_progress'] { border-color: var(--red-hi); background: var(--red); }
.legend i[data-s='interrupted'] { border-color: var(--amber); background: rgba(255, 178, 36, 0.3); }
.legend i[data-s='absent'] { border-color: rgba(234, 29, 44, 0.6); background: repeating-linear-gradient(135deg, var(--red-a14) 0 3px, rgba(234, 29, 44, 0.35) 3px 6px); }
.legend i[data-s='done'] { border-color: var(--green); background: var(--green-a); }
.legend i[data-s='partial'] { border-color: var(--amber); background: var(--amber-a); }
.legend i[data-s='missed'] { background: repeating-linear-gradient(135deg, var(--s2) 0 3px, var(--s4) 3px 6px); }
.legend i[data-s='off'] { border-color: rgba(126, 166, 255, 0.5); background: var(--blue-a); }
.legend i[data-s='extra'] { border-style: dashed; border-color: var(--green); }

/* ───────── Financeiro ───────── */
.week-row { width: 100%; text-align: left; background: var(--s1); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; transition: background 0.15s, transform 0.12s var(--ease); }
.week-row:active { transform: scale(0.99); background: var(--s2); }
.week-row[aria-current='true'] { border-color: rgba(234, 29, 44, 0.5); }
.week-row .cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.week-row .cols div { min-width: 0; }
.week-row .cols span { display: block; font-size: 10.5px; color: var(--fg3); letter-spacing: 0.06em; text-transform: uppercase; }
.week-row .cols b { font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ev-row { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--s1); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.ev-row:active { background: var(--s2); }
.ev-ico { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--green-a); color: var(--green); flex: none; }
.chart-cap { font-size: 12.5px; color: var(--fg2); min-height: 36px; margin-bottom: 4px; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--fg3); font-size: 10px; font-family: var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .bar-hit { fill: transparent; cursor: pointer; }
.chart-legend { display: flex; gap: 14px; font-size: 12px; color: var(--fg2); margin-top: 6px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { display: inline-block; width: 12px; height: 8px; border-radius: 3px; background: var(--red); }
.chart-legend i.tick { height: 2px; background: var(--fg2); }


/* ───────── Meta do dia: projeção ───────── */
.proj { margin-top: 10px; padding: 8px 12px; border-radius: 14px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); font-size: 13px; color: var(--fg2); display: flex; flex-direction: column; gap: 4px; }
.proj.muted { color: var(--fg3); flex-direction: row; align-items: center; gap: 6px; flex-wrap: wrap; }
.proj.ok { flex-direction: row; align-items: center; gap: 6px; color: var(--green); background: var(--green-a); border-color: rgba(53, 212, 137, 0.35); font-weight: 600; }
.proj-hint { margin-top: 8px; font-size: 12px; color: var(--fg3); display: flex; align-items: center; gap: 6px; }
.proj-main { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; color: var(--fg); font-size: 14px; }
.proj-main .proj-eta { margin-left: auto; }
.proj .hint { font-size: 12px; line-height: 1.3; }
.proj-main b { font-variant-numeric: tabular-nums; }
.proj-eta { font-family: var(--font-display); font-weight: 700; color: var(--red-hi); font-variant-numeric: tabular-nums; }

/* ───────── Escala: planejamento publicado/bloqueado ───────── */
.plan-card { transition: border-color 0.3s, box-shadow 0.4s; }
.plan-card.locked { border-color: rgba(53, 212, 137, 0.4); box-shadow: 0 0 30px -24px rgba(53, 212, 137, 0.9), 0 1px 0 rgba(255, 255, 255, 0.04) inset; }
.plan-card.unlocked { border-color: rgba(255, 178, 36, 0.55); box-shadow: 0 0 30px -22px rgba(255, 178, 36, 0.9), 0 1px 0 rgba(255, 255, 255, 0.04) inset; }
.plain-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--fg2); }
.plain-list li { overflow-wrap: anywhere; }
.plain-list li.amber { color: var(--amber); }
.goal-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; }
.goal-row > label, .goal-row > span { color: var(--fg2); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.goal-row.ro b { font-variant-numeric: tabular-nums; }
.goal-row.ro { flex-wrap: wrap; }
.goal-row.col { flex-direction: column; align-items: stretch; gap: 8px; }
.goal-line1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.goal-line2 .seg button { min-height: 36px; font-size: 13px; }
.goal-need { color: var(--fg3); font-size: 12px; line-height: 1.4; flex-basis: 100%; }
.input-wrap.sm { width: 140px; flex: none; }
.input-wrap.sm .pre { font-size: 13px; left: 11px; }
.input.mini-in { min-height: 40px; font-size: 15px; padding-left: 36px; padding-right: 10px; border-radius: 11px; text-align: right; }
.input-wrap.sm .input { padding-left: 36px; }
.stack.is-locked .bc { cursor: default; }
.stack.is-locked .bc:active { transform: none; }
.stack.is-locked .bc[data-s='planned']::after, .stack.is-locked .bc[data-s='off']::after { content: ''; position: absolute; top: 6px; right: 6px; width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: 0.35; }

/* ───────── Interruptor, segmentado, volume, efeitos ───────── */
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.switch-row label { cursor: pointer; min-width: 0; }
.switch { position: relative; flex: none; width: 52px; height: 30px; border-radius: 99px; border: 1.5px solid var(--line2); background: var(--s4); padding: 0; transition: background 0.2s, border-color 0.2s; }
.switch i { position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: var(--fg2); transition: transform 0.22s var(--ease), background 0.2s; }
.switch[aria-checked='true'] { background: var(--red-a28); border-color: var(--red-hi); }
.switch[aria-checked='true'] i { transform: translateX(22px); background: #fff; box-shadow: 0 0 10px var(--red-glow); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1 1 auto; min-height: 42px; padding: 0 12px; border-radius: 12px; border: 1.5px solid var(--line2); background: var(--s2); color: var(--fg2); font-weight: 600; font-size: 13.5px; transition: all 0.15s var(--ease); white-space: nowrap; }
.seg button:active { transform: scale(0.97); }
.seg button[aria-pressed='true'] { border-color: var(--red-hi); background: var(--red-a14); color: #fff; box-shadow: 0 0 16px -8px var(--red-glow); }
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; padding: 0; margin: 0; }
.range::-webkit-slider-runnable-track { height: 6px; border-radius: 99px; background: var(--s4); }
.range::-moz-range-track { height: 6px; border-radius: 99px; background: var(--s4); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -9px; border-radius: 50%; background: #fff; border: 2px solid var(--red-hi); box-shadow: 0 0 10px var(--red-glow); }
.range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid var(--red-hi); box-shadow: 0 0 10px var(--red-glow); }
.range:disabled { opacity: 0.4; }
.cue-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--s1); border: 1px solid var(--line); font-size: 14px; }
.cue-row .hint { margin-top: 1px; }

/* ───────── Relatórios ───────── */
.chart-legend i.dot { height: 8px; }
.hbar { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; grid-template-areas: 'l t v' '. s s'; align-items: center; column-gap: 10px; row-gap: 2px; }
.hb-label { grid-area: l; font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--fg2); }
.hb-track { grid-area: t; height: 10px; border-radius: 99px; background: var(--s4); overflow: hidden; }
.hb-track > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--red-lo), var(--red-hi)); transition: width 0.5s var(--ease); }
.hb-val { grid-area: v; font-weight: 700; font-size: 13.5px; white-space: nowrap; }
.hb-sub { grid-area: s; font-size: 11.5px; color: var(--fg3); }
.cmp { margin-top: 10px; display: flex; flex-direction: column; }
.cmp-row { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.4fr); gap: 6px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--fg2); }
.cmp-row:last-child { border-bottom: 0; }
.cmp-row.head { color: var(--fg3); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding-top: 12px; }
.cmp-row .num { font-weight: 600; color: var(--fg); text-align: right; overflow-wrap: anywhere; }
.cmp-row.head b { text-align: right; font-weight: 700; }
.cmp-row .num.green { color: var(--green); }
.cmp-row .num.red { color: var(--red-hi); }
.hstrip { display: grid; grid-template-columns: repeat(18, minmax(0, 1fr)); gap: 3px; margin-top: 6px; }
.hcell { background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.hcell i { display: block; width: 100%; height: 34px; border-radius: 5px; background: var(--red); transition: transform 0.12s var(--ease); }
.hcell span { font-family: var(--font-mono); font-size: 9.5px; color: var(--fg3); height: 11px; }
.hcell[aria-pressed='true'] i { outline: 2px solid #fff; outline-offset: 1px; }
.hcell:active i { transform: scale(0.92); }
.kv strong.red { color: var(--red-hi); }
.kv strong.amber { color: var(--amber); }

/* ───────── Toast, splash ───────── */
.toasts { position: fixed; z-index: 80; left: 0; right: 0; top: calc(6px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toast { pointer-events: none; display: flex; align-items: center; gap: 10px; max-width: 480px; padding: 12px 16px; border-radius: 16px; background: #1a1a1e; border: 1px solid var(--line2); box-shadow: 0 14px 40px -10px #000; font-size: 14.5px; font-weight: 600; animation: toast-in 0.35s var(--ease); }
.toast.ok { border-color: rgba(53, 212, 137, 0.5); }
.toast.ok svg { color: var(--green); }
.toast.warn { border-color: rgba(255, 178, 36, 0.55); }
.toast.warn svg { color: var(--amber); }
.toast.out { animation: toast-out 0.25s ease-in forwards; }
.splash { height: 100%; display: grid; place-items: center; color: var(--fg3); font-family: var(--font-display); letter-spacing: 0.2em; font-size: 13px; }

/* ───────── Animações ───────── */
@keyframes screen-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheet-in { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toast-in { from { opacity: 0; transform: translateY(-12px) scale(0.96); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(-8px); } }
@keyframes tl-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes flash { 0% { background: var(--red-a28); } 100% { background: var(--s1); } }
@keyframes hold-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.78); } }
@keyframes glow-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(234, 29, 44, 0.55), 0 12px 34px -10px rgba(234, 29, 44, 0.5); } 50% { box-shadow: 0 0 0 7px rgba(234, 29, 44, 0), 0 12px 44px -6px rgba(234, 29, 44, 0.75); } }
@keyframes glow-breathe { 0%, 100% { box-shadow: 0 12px 30px -12px rgba(234, 29, 44, 0.45), 0 1px 0 rgba(255, 255, 255, 0.3) inset; } 50% { box-shadow: 0 14px 44px -8px rgba(234, 29, 44, 0.7), 0 1px 0 rgba(255, 255, 255, 0.3) inset; } }
@keyframes ring-draw { from { stroke-dashoffset: var(--circ); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* ───────── Pausa programada ───────── */
.chip-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.chip-opt { min-height: 58px; border-radius: 14px; border: 1px solid var(--line2); background: var(--s2); color: var(--fg); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; padding: 4px 2px; min-width: 0; transition: transform 0.12s var(--ease), background 0.15s, border-color 0.15s; }
.chip-opt b { font-family: var(--font-display); font-size: 19px; }
.chip-opt span { font-size: 11.5px; color: var(--fg3); font-weight: 600; }
.chip-opt:active { transform: scale(0.95); }
.chip-opt[aria-pressed='true'] { border-color: var(--red-hi); background: var(--red-a14); box-shadow: 0 0 18px -6px var(--red-glow); }
.chip-opt[aria-pressed='true'] span { color: var(--fg2); }
.pause-preview { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 10px 12px; border-radius: 14px; background: var(--s1); border: 1px solid var(--line); }
.pause-preview > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pause-preview b { font-size: 17px; }
.pause-preview > .hint { grid-column: 1 / -1; }
.link-btn { background: none; border: 0; color: var(--fg2); text-decoration: underline; text-underline-offset: 3px; font-size: 13.5px; padding: 8px 4px; align-self: center; min-height: 40px; }
@keyframes glow-pulse-amber { 0%, 100% { box-shadow: 0 0 22px -12px rgba(255, 178, 36, 0.6); } 50% { box-shadow: 0 0 44px -8px rgba(255, 178, 36, 0.9); } }

/* ───────── Telas estreitas, altas e baixas ───────── */
@media (max-width: 349px) {
  .dock-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dock-row.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dk { min-height: 48px; flex-direction: row; gap: 8px; }
  .chip-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .hero { padding: 10px 12px; }
  .nav button { font-size: 11px; }
}
@media (max-height: 700px) and (orientation: portrait) {
  .big { min-height: 56px; }
  .dk { min-height: 50px; }
  .dk.sq { min-height: 56px; }
  .nav button { height: 54px; }
  .topbar { height: 48px; }
  .clock { font-size: clamp(30px, 11vw, 40px); }
}
/* Celular deitado: o painel e a lista ficam à esquerda; as ações, numa coluna à direita. */
@media (orientation: landscape) and (max-height: 520px) {
  .app { max-width: 980px; }
  .topbar { height: 42px; }
  .nav button { height: 46px; flex-direction: row; gap: 8px; }
  .screen.journey { flex-direction: row; }
  .screen.journey .j-scroll { flex: 1 1 auto; min-width: 0; padding-right: 12px; }
  .screen.journey .dock { flex: 0 0 min(42%, 340px); border-top: 0; border-left: 1px solid var(--line); overflow-y: auto; justify-content: center; padding-left: 12px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .screen.journey .dock-row, .screen.journey .dock-row.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .screen.journey .dk { min-height: 46px; flex-direction: row; gap: 8px; }
  .big { min-height: 56px; }
  .clock { font-size: clamp(30px, 8vw, 40px); }
  .hero-sticky { position: static; }
  .sheet { max-height: 98%; }
}
@media (min-width: 480px) {
  .ind-cells { --cell-min: 100px !important; }
}
@media (prefers-reduced-motion: reduce) {
  .hero[data-s='paused-over'], .hero[data-s='running'], .big.idle-glow, .big.live { animation: none; }
}

/* ═════════ Refinamento visual ═════════
   Mais ar, menos caixas dentro de caixas, tipografia mais clara. A identidade continua (preto/grafite, vermelho, branco),
   mas brilho forte só aparece onde significa algo: estado da operação, corrida em andamento, confirmações, meta batida e alertas. */
.scroll { gap: 16px; }
.card { background: var(--s1); border-radius: 20px; padding: 18px; box-shadow: none; }
.card-h { margin-bottom: 14px; }
.h2 { font-size: 16px; font-weight: 600; letter-spacing: 0; }
.stat { background: transparent; border: 0; border-left: 2px solid var(--line2); border-radius: 0; padding: 2px 0 2px 12px; }
.stat .v { font-size: 20px; font-weight: 600; }
.btn { background: var(--s2); }
.btn.primary { box-shadow: 0 8px 20px -12px var(--red-glow); }
.nav button[aria-selected='true'] svg { filter: none; }
.bar > i { box-shadow: none; }
.cell { background: rgba(255, 255, 255, 0.025); border-color: transparent; }
.week-row { background: transparent; border-radius: 16px; }
.kv span:first-child { min-width: 0; }
.kv strong { flex: none; white-space: nowrap; text-align: right; }

/* Seções dentro de um cartão (em vez de cartões aninhados) */
.sec { padding: 2px 0 8px; }
.sec + .sec { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; margin-bottom: 2px; }
.sec-h span { font-weight: 700; font-size: 12.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--fg2); }
.sec-h small { color: var(--fg3); font-size: 12px; }
.kv.strong { border-top: 1px dashed var(--line2); margin-top: 2px; }
.kv.strong span:first-child { color: var(--fg); font-weight: 600; }

/* Financeiro: quarta-feira em destaque */
.pay-hero { display: flex; flex-direction: column; gap: 10px; border-color: rgba(234, 29, 44, 0.3); background: linear-gradient(180deg, rgba(234, 29, 44, 0.07), var(--s1) 65%); }
.pay-hero .card-h { margin-bottom: 0; flex-wrap: wrap; }
.pay-val { font-family: var(--font-display); font-weight: 800; font-size: clamp(32px, 11vw, 44px); line-height: 1.05; letter-spacing: -0.01em; overflow-wrap: anywhere; }

.ret-day, .adv-day { padding: 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; }
.ret-day:first-child, .adv-day:first-child { border-top: 0; padding-top: 0; }
.ret-head, .adv-head { display: flex; justify-content: space-between; align-items: baseline; gap: 2px 10px; flex-wrap: wrap; }
.ret-head b, .adv-head b { font-size: 14px; display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ret-head .run { color: var(--fg3); font-size: 12px; }
.ret-line { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--fg2); }
.ret-line strong { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
.tag { font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--blue); background: var(--blue-a); border-radius: 99px; padding: 2px 8px; font-weight: 700; }
.adv-head small { color: var(--fg3); font-size: 12px; margin-left: 6px; }
.adv-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 6px 12px; margin-top: 4px; }
.adv-cols span { display: block; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg3); }
.adv-cols b { font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.week-row .cols { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px 10px; }

.effect { border: 1px dashed var(--line2); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--s1); }
.effect-h { display: flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; color: var(--fg2); text-transform: uppercase; letter-spacing: 0.06em; }
.effect-l { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; }
.effect-l.muted { color: var(--fg3); font-size: 12.5px; }
.effect-l b { font-variant-numeric: tabular-nums; flex: none; }

.week-row .row.between { flex-wrap: wrap; gap: 6px 10px; }

/* Blocos da Escala: nada cortado em 320–360 px (texto em frase, faixas em duas linhas) */
.bc .b-state { font-size: 10.5px; letter-spacing: 0; text-transform: none; line-height: 1.15; white-space: normal; overflow-wrap: anywhere; }
.bc .b-work { font-size: 9.5px; }
.bc .b-work .rng { display: block; margin-top: 2px; white-space: nowrap; }
.bc .b-work .rng span { display: block; }
.nw { white-space: nowrap; }
@media (max-width: 380px) {
  .bc { padding: 7px 5px 8px; }
  .bc .b-time { font-size: 9.5px; white-space: nowrap; }
  .bc .b-state { font-size: 9.5px; overflow-wrap: normal; word-break: normal; hyphens: none; }
  .bc .b-work { font-size: 9px; }
}
@media (max-width: 340px) {
  .bc .b-state { font-size: 9px; }
}

/* ───────── Armazenamento, cópias de segurança e boas-vindas ───────── */
.bk-toggle {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px;
  background: none; border: 0; border-top: 1px solid var(--line); color: var(--fg); font-weight: 600; font-size: 14px; text-align: left; padding: 0;
}
.bk-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.bk-row b { font-size: 13.5px; font-weight: 600; }
.bk-legacy { border-top: 1px solid var(--line); padding-top: 12px; font-size: 13.5px; }

/* ───────── Aviso de nova versão (PWA) ─────────
   Faixa no fluxo da página (logo abaixo do cabeçalho), nunca por cima dos botões de operação. */
.update-bar {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
  padding-top: 10px; padding-bottom: 10px; background: var(--s3); border-bottom: 1px solid var(--line2);
}
.update-text { display: flex; flex-direction: column; gap: 1px; font-size: 14px; min-width: 0; flex: 1 1 200px; }
.update-text span { color: var(--fg2); font-size: 12.5px; }
.update-actions { display: flex; gap: 8px; flex: 0 1 auto; }
.update-actions .btn { min-height: 40px; padding-left: 12px; padding-right: 12px; }
.update-actions .btn:disabled { opacity: 0.45; }
